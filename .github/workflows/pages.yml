name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Publishing is gated on a repository variable rather than always attempted.
# Pages cannot serve from a private repository on a free plan, so an
# unconditional configure-pages step fails on every push and a red tick stops
# meaning anything. The build always runs; publishing waits to be switched on:
#
#   gh variable set PAGES_ENABLED --body true --repo <owner>/<repo>
env:
  PAGES: ${{ vars.PAGES_ENABLED }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # The three strings the client needs. They are repository secrets rather
      # than committed values: a `client` credential is designed to ship inside
      # a build, but a public repo would hand it over without the build.
      - run: npm run build
        env:
          VITE_MW_EDGE_URL: ${{ secrets.VITE_MW_EDGE_URL }}
          VITE_MW_CLIENT_ID: ${{ secrets.VITE_MW_CLIENT_ID }}
          VITE_MW_CLIENT_SECRET: ${{ secrets.VITE_MW_CLIENT_SECRET }}
      - if: env.PAGES != 'true'
        run: echo "::notice::Built. Pages publishing is off — set the PAGES_ENABLED repository variable to turn it on."
      - if: env.PAGES == 'true'
        uses: actions/configure-pages@v5
      - if: env.PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
